    <!DOCTYPE html>
<html lang="nl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="De persoonlijke homepage van Thies.">
	<title>Thies — doei123</title>
	<style>
		:root {
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			color: #19352d;
			background: #f2f6f1;
		}
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			padding: 24px;
			display: grid;
			place-items: center;
		}
		main {
			width: min(100%, 700px);
			padding: clamp(32px, 8vw, 72px);
			background: #fff;
			border: 1px solid #e2ebe2;
			border-radius: 24px;
			box-shadow: 0 20px 60px #19352d12;
		}
		.label {
			margin: 0 0 16px;
			color: #43805f;
			font-size: .8rem;
			font-weight: 700;
			letter-spacing: .12em;
			text-transform: uppercase;
		}
		h1 {
			margin: 0;
			font-size: clamp(2.5rem, 8vw, 4.5rem);
			line-height: 1.05;
			letter-spacing: -.055em;
		}
		.intro {
			max-width: 48ch;
			margin: 20px 0 30px;
			color: #586a62;
			font-size: 1.1rem;
			line-height: 1.7;
		}
		a {
			display: inline-block;
			padding: 12px 18px;
			border-radius: 999px;
			background: #286044;
			color: #fff;
			font-weight: 650;
			text-decoration: none;
		}
		a:hover, a:focus-visible { background: #194832; }
		a:focus-visible { outline: 3px solid #9ed6b1; outline-offset: 3px; }
	</style>
</head>
<body>
	<main>
		<p class="label">Welkom op mijn website</p>
		<h1>Hoi, ik ben Thies.</h1>
		<p class="intro">Leuk dat je er bent! Dit is mijn eigen plekje op het internet. Binnenkort vind je hier meer over mij en waar ik mee bezig ben.</p>
		<a href="mailto:thies@example.com">Stuur me een bericht</a>
	</main>
</body>
</html>
